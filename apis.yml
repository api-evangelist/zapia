name: Zapia
description: 'Zapia is a personal AI assistant built for Latin America by BrainLogic AI (a Uruguay/Silicon
  Valley startup), delivered inside WhatsApp and as native Android and iOS apps plus a Flutter web app at
  app.zapia.com. It engages consumers in hyper-localized, natural-language conversations to compare prices,
  reply to and transcribe WhatsApp messages and voice notes, organize calendars (with Google Calendar sync),
  make reservations, and discover nearby businesses using BrainLogic''s database of millions of Latin
  American business WhatsApp numbers. Zapia runs on Claude via Google Cloud Vertex AI and has surpassed
  5.5 million users across the region, backed by seed funding led by Prosus Ventures. It is a consumer
  (B2C) product: as of this pass it publishes no public developer API, OpenAPI specification, SDKs, or
  developer portal — this profile captures its public identity and consumer-facing surfaces.'
